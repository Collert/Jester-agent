# Pushing a tag like v0.2.0 makes a GitHub release with:
#   - jester-agent-linux-arm64 (+ .sha256): the agent on its own, for updates later
#   - <date>-jester.img.xz: the SD card image
#   - jester-imager.json: the list Raspberry Pi Imager reads to offer the image with its settings. The latest one is
#     always at https://github.com/<owner>/<repo>/releases/latest/download/jester-imager.json
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  image:
    uses: ./.github/workflows/image.yml
    secrets: inherit

  release:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Imager's list
        run: |
          img=$(ls out/*.img.xz)
          bash image/imager-list.sh "$img" "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$(basename "$img")" > out/jester-imager.json
          cat out/jester-imager.json
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" out/* --title "${{ github.ref_name }}" --generate-notes
