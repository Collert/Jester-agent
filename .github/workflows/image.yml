# Builds the SD card image (image/build.sh) around the agent built by agent.yml. Run it from the Actions tab; tagged
# releases run it too (release.yml). Needs the repository secret JESTER_PASSWORD (the jester user's password, for
# SSH) and optionally JESTER_SSH_KEY (a public key to log in with instead).
name: SD card image

on:
  workflow_dispatch:
  workflow_call:

jobs:
  agent:
    uses: ./.github/workflows/agent.yml

  image:
    needs: agent
    # An ARM runner (free for public repositories) runs the Pi's programs as they are. On an Intel runner pi-gen
    # emulates the CPU with qemu-user-static, which takes about an hour, and newer Ubuntus no longer have it.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: jester-agent-linux-arm64
          path: bin
      - name: Make room # pi-gen needs about 20 GB; some runners have less free (deleting takes a minute or two)
        run: |
          df -h /
          if [ "$(df --output=avail -BG / | tail -1 | tr -dc 0-9)" -lt 30 ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
            df -h /
          fi
      - name: Build
        env:
          JESTER_PASSWORD: ${{ secrets.JESTER_PASSWORD }}
          JESTER_SSH_KEY: ${{ secrets.JESTER_SSH_KEY }}
        run: bash image/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: jester-image
          path: image/pi-gen/deploy/*.img.xz
          compression-level: 0 # already xz
